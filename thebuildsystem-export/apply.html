<!-- This form mirrors the #apply section on index.html (that page is the
     one linked from the nav; this one is the direct/shareable link — bio,
     ads, etc). If you change a question, label or the EN/ES text here,
     make the same change over there so both stay in sync. -->
<div class="apply-wrap">
  <div class="apply-head">
    <p class="eyebrow" data-i18n="apply.eyebrow">Pilot program — limited spots</p>
    <h1 data-i18n="apply.h1">Coaching 1:1</h1>
    <p class="apply-lede" data-i18n="apply.p">Fill this out and I'll reach out to see if you're a fit for the next group.</p>
  </div>

  <form id="form-apply" class="apply-form" novalidate>
    <h3 class="apply-section-title" data-i18n="apply.details">Your details</h3>

    <div class="field">
      <label for="ap-firstname" data-i18n="apply.firstname">First name</label>
      <input type="text" id="ap-firstname" autocomplete="given-name">
    </div>

    <div class="field">
      <label for="ap-email" data-i18n="apply.email">Email</label>
      <input type="email" id="ap-email" autocomplete="email">
    </div>

    <div class="field">
      <label for="ap-phone" data-i18n="apply.phone">Phone</label>
      <input type="tel" id="ap-phone" placeholder="+54 9 11 1234 5678" autocomplete="tel">
    </div>

    <div class="field">
      <label for="ap-birthday" data-i18n="apply.birthday">Birthday</label>
      <input type="date" id="ap-birthday">
    </div>

    <div class="field">
      <label data-i18n="apply.timeline.label">How soon are you ready to start?</label>
      <div class="pill-group">
        <label class="pill"><input type="radio" name="timeline" value="ASAP"><span data-i18n="apply.timeline.asap">ASAP</span></label>
        <label class="pill"><input type="radio" name="timeline" value="1-2 weeks"><span data-i18n="apply.timeline.weeks">1-2 weeks</span></label>
        <label class="pill"><input type="radio" name="timeline" value="Just looking"><span data-i18n="apply.timeline.looking">Just looking</span></label>
      </div>
    </div>

    <div class="field">
      <label data-i18n="apply.goal.label">What is your main goal right now?</label>
      <div class="pill-group">
        <label class="pill"><input type="checkbox" name="goal" value="Athletic performance"><span data-i18n="apply.goal.athletic">Athletic performance</span></label>
        <label class="pill"><input type="checkbox" name="goal" value="Body recomposition (fat loss)"><span data-i18n="apply.goal.recomp">Body recomposition (fat loss)</span></label>
        <label class="pill"><input type="checkbox" name="goal" value="Endurance"><span data-i18n="apply.goal.endurance">Endurance</span></label>
        <label class="pill"><input type="checkbox" name="goal" value="Hypertrophy (build muscle)"><span data-i18n="apply.goal.hypertrophy">Hypertrophy (build muscle)</span></label>
        <label class="pill"><input type="checkbox" name="goal" value="Elite sport"><span data-i18n="apply.goal.elite">Elite sport</span></label>
      </div>
    </div>

    <div class="field" style="position:absolute; left:-9999px; top:-9999px;" aria-hidden="true">
      <label for="ap-website">Leave this field empty</label>
      <input type="text" id="ap-website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div id="apply-error" class="auth-msg" style="margin-top:4px;"></div>
    <button class="btn btn-primary" type="submit" data-i18n="apply.submit">Submit application</button>
  </form>

  <div id="apply-success" class="apply-success" style="display:none;">
    <h3 data-i18n="apply.success.h3">Got it</h3>
    <p data-i18n="apply.success.p">I'll reach out soon to set up a call and see if you're a fit for the next group.</p>
  </div>
</div>
